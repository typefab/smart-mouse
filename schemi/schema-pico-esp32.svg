<text class="s" x="335" y="124" text-anchor="middle">VBUS · pin 40</text><text class="s" x="335" y="154" text-anchor="middle">GP0 · pin 1</text><text class="s" x="335" y="184" text-anchor="middle">GP1 · pin 2</text><text class="s" x="335" y="214" text-anchor="middle">GND · pin 3</text><text class="s" x="335" y="244" text-anchor="middle">GP4 TX · pin 6</text><text class="s" x="335" y="268" text-anchor="middle">GP5 RX · pin 7</text>
