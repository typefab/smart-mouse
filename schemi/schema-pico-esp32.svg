<line x1="170" y1="120" x2="250" y2="120" stroke="#E24B4A" stroke-width="3"/><line x1="170" y1="150" x2="250" y2="150" stroke="#639922" stroke-width="3"/><line x1="170" y1="180" x2="250" y2="180" stroke="#AAA" stroke-width="3"/><line x1="170" y1="210" x2="250" y2="210" stroke="#222" stroke-width="3"/>
