<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:14px;font-weight:bold;fill:#222}.s{font-size:12px;fill:#333}.n{font-size:11px;fill:#666}.g{fill:#F1EFE8;stroke:#888780}.p{fill:#E1F5EE;stroke:#0F6E56}.e{fill:#EEEDFE;stroke:#534AB7}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text class="h" x="40" y="30">Schema 3 — Cavo USB saldato sui pad del Pico (al posto della micro-USB)</text>
<rect class="g" x="40" y="60" width="150" height="170" rx="8"/><text class="h" x="115" y="86" text-anchor="middle">Cavo USB</text>
<text class="s" x="115" y="114" text-anchor="middle">Rosso (5V)</text><text class="s" x="115" y="144" text-anchor="middle">Bianco (D−)</text><text class="s" x="115" y="174" text-anchor="middle">Verde (D+)</text><text class="s" x="115" y="204" text-anchor="middle">Nero (GND)</text>
<line x1="190" y1="110" x2="330" y2="110" stroke="#E24B4A" stroke-width="3"/><line x1="190" y1="140" x2="330" y2="140" stroke="#AAA" stroke-width="3"/><line x1="190" y1="170" x2="330" y2="170" stroke="#639922" stroke-width="3"/><line x1="190" y1="200" x2="330" y2="200" stroke="#222" stroke-width="3"/>
<rect class="p" x="330" y="60" width="200" height="170" rx="8"/><text class="h" x="430" y="86" text-anchor="middle">Pico (retro scheda)</text>
<text class="s" x="430" y="114" text-anchor="middle">VBUS · pin 40</text><text class="s" x="430" y="144" text-anchor="middle">pad TP2 (D−)</text><text class="s" x="430" y="174" text-anchor="middle">pad TP3 (D+)</text><text class="s" x="430" y="204" text-anchor="middle">pad TP1 o pin GND</text>
<text class="n" x="40" y="265">Pad piccoli: punta fine, poco stagno, colla a caldo come fermacavo. D+ e D− corti e intrecciati.</text>
<text class="n" x="40" y="285">Non usare mai insieme micro-USB e cavo saldato. BOOTSEL premuto all'avvio per aggiornare il firmware.</text>
</svg>
