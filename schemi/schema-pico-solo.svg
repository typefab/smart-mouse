<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:14px;font-weight:bold;fill:#222}.s{font-size:12px;fill:#333}.n{font-size:11px;fill:#666}.g{fill:#F1EFE8;stroke:#888780}.p{fill:#E1F5EE;stroke:#0F6E56}.e{fill:#EEEDFE;stroke:#534AB7}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text class="h" x="40" y="30">Schema 1 — Solo Raspberry Pi Pico (HID Remapper, single Pico)</text>
<rect class="g" x="40" y="117" width="120" height="56" rx="8"/><text class="h" x="100" y="140" text-anchor="middle">Mouse Trust</text><text class="s" x="100" y="160" text-anchor="middle">cavo originale</text>
<line x1="160" y1="145" x2="188" y2="145" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="g" x="192" y="60" width="130" height="170" rx="8"/><text class="h" x="257" y="86" text-anchor="middle">Porta USB-A</text>
<text class="s" x="257" y="114" text-anchor="middle">VBUS (5V)</text><text class="s" x="257" y="144" text-anchor="middle">D+ (verde)</text><text class="s" x="257" y="174" text-anchor="middle">D− (bianco)</text><text class="s" x="257" y="204" text-anchor="middle">GND (nero)</text>
<line x1="322" y1="110" x2="400" y2="110" stroke="#E24B4A" stroke-width="3"/><line x1="322" y1="140" x2="400" y2="140" stroke="#639922" stroke-width="3"/><line x1="322" y1="170" x2="400" y2="170" stroke="#AAA" stroke-width="3"/><line x1="322" y1="200" x2="400" y2="200" stroke="#222" stroke-width="3"/>
