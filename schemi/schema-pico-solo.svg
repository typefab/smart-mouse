<text class="s" x="485" y="114" text-anchor="middle">VBUS · pin 40</text><text class="s" x="485" y="144" text-anchor="middle">GP0 · pin 1</text><text class="s" x="485" y="174" text-anchor="middle">GP1 · pin 2</text><text class="s" x="485" y="204" text-anchor="middle">GND · pin 3</text>
<line x1="485" y1="230" x2="485" y2="276" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="g" x="395" y="280" width="180" height="56" rx="8"/><text class="h" x="485" y="303" text-anchor="middle">PC</text><text class="s" x="485" y="323" text-anchor="middle">micro-USB del Pico</text>
<text class="n" x="40" y="370">Verificare i colori dei fili con il multimetro. Il Pico alimenta il mouse tramite VBUS.</text>
<text class="n" x="40" y="390">Firmware: remapper.uf2 (HID Remapper). Configurazione da browser su remapper.org.</text>
